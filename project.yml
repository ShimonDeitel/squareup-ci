name: Squareup
options:
  bundleIdPrefix: com.shimondeitel.squareup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Squareup:
    type: application
    platform: iOS
    sources:
      - path: Squareup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.squareup
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Squareup/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  SquareupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SquareupTests
      - path: Squareup.storekit
    dependencies:
      - target: Squareup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.squareup.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  SquareupUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SquareupUITests
    dependencies:
      - target: Squareup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.squareup.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Squareup:
    build:
      targets:
        Squareup: all
        SquareupTests: [test]
        SquareupUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Squareup.storekit
    test:
      config: Debug
      storeKitConfiguration: Squareup.storekit
      targets:
        - SquareupTests
        - SquareupUITests
    archive:
      config: Release
